[package]
name = "rtn"
version = "0.1.0"
edition = "2021"
description = "A command line for Routine, over its local MCP server"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["json"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros", "local-offset"] }
termimad = "0.35.3"

[profile.release]
strip = true
opt-level = "z"
lto = true
